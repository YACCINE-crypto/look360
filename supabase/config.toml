# Configuration minimale du projet Supabase local (CLI).
# `project_id` est un simple nom de référence local ; le vrai projet distant
# est associé via `supabase link --project-ref <ref>`.
project_id = "look360"

[db]
# Version majeure de Postgres du projet distant.
major_version = 17

# --- Edge Functions (paiement) ---
# create-payment : appelée par l'app avec le JWT de l'utilisateur → JWT requis.
[functions.geniuspay-create-payment]
verify_jwt = true

# webhook : appelé par le prestataire (serveur→serveur), auth = HMAC → PAS de JWT.
[functions.geniuspay-webhook]
verify_jwt = false

# relances : appelée par un cron, protégée par x-cron-secret → PAS de JWT.
[functions.subscription-reminders]
verify_jwt = false
